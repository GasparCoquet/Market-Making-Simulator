[build-system]
# PEP 639 SPDX license expressions need setuptools 77 or newer.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-making-simulator"
# Single-sourced from market_making_simulator.__version__ so the installed
# metadata and the runtime attribute cannot drift apart.
dynamic = ["version"]
description = "Avellaneda-Stoikov style market-making simulator with an exact PnL decomposition"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaspar Coquet" }]
keywords = [
    "market-making",
    "market-microstructure",
    "avellaneda-stoikov",
    "quantitative-finance",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# numpy and matplotlib are imported by the package itself. pandas is imported
# only by benchmarks.py at the repo root, and is declared here so that a single
# `pip install -e .` is enough to run everything in the repository.
#
# Upper bounds are the next major version of each dependency. Only long-stable
# APIs are used (ndarray arithmetic, default_rng, pyplot, DataFrame), so the
# caps exist to stop an unreviewed major release from silently changing
# results, not because a specific incompatibility is known.
dependencies = [
    "numpy>=1.21,<3.0",
    "pandas>=1.3,<4.0",
    "matplotlib>=3.4,<4.0",
]

[project.optional-dependencies]
# pytest is optional: the suite is plain unittest and runs without it. Nothing
# here needs build or pyyaml, so they are not declared.
dev = [
    "pytest>=7.0,<9.0",
]

[project.urls]
Homepage = "https://github.com/GasparCoquet/Market-Making-Simulator"
Repository = "https://github.com/GasparCoquet/Market-Making-Simulator"
Issues = "https://github.com/GasparCoquet/Market-Making-Simulator/issues"

[tool.setuptools.dynamic]
# setuptools reads this statically from the AST, so the build does not import
# the package and does not need numpy or matplotlib present at build time.
version = { attr = "market_making_simulator.__version__" }

[tool.setuptools.packages.find]
# Explicit include, otherwise setuptools' auto-discovery picks up tests/ as a
# top-level package because it has an __init__.py.
include = ["market_making_simulator*"]
namespaces = false
